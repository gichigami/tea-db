# Producer alias seed list for the canonical producer matcher.
#
# Consumer: the producer-alias loader (data-engineer, spec §12 "Hybrid
# canonical matcher"). Every string in `aliases` resolves to its entry's
# `canonical` producer. Curated by ontology-curator.
#
# Built from the raw strings in the committed fixtures (YS `Producer_*` tags
# and Shopify `vendor` fields in tests/fixtures/cassettes/*_products.yaml,
# the golden JSONL under tests/fixtures/golden/, and the gzipped Steepster
# cassette) plus domain knowledge. It was NOT derived from the labeled
# evaluation set tests/fixtures/matching/producer_pairs.jsonl.
#
# Invariants (the loader should assert all of them):
#   1. After _producer_norm (NFC + lowercase + whitespace collapse) each alias
#      appears exactly once in the file, and no alias equals the normalized
#      form of another entry's `canonical`.
#   2. An alias must name the SAME producing entity as its canonical. A brand
#      becomes an alias only when exactly one producer owns it (Dayi ->
#      Menghai Tea Factory, Lao Tong Zhi -> Haiwan, Three Cranes -> Wuzhou).
#   3. A bare toponym (county, town, mountain, village, farm, city) is NEVER
#      an alias, even when a factory is named after it. "Menghai", "Xiaguan",
#      "Mengku", "Jinggu", "Liming", "Nanqiao", "Wuzhou", "Haiwan", "Bulang",
#      "Lao Ban Zhang", "Yiwu", "Pasha", "Lao Man'e" and "Wu Liang" all appear
#      in fixture titles as places, often in the same title as some other
#      producer (e.g. `2004 Menghai Bamboo Leaf Ripe Pu-erh Tea Brick` under
#      vendor "Other Factories"; `2005 Xinghai "Lao Ban Zhang"`;
#      `2005 Nan Qiao "Liming Impression"`; `2009 Jinggu ...` under Producer
#      tag "Yi Shan Tea Factory").
#      Two flagged exceptions: "Bai Sha Xi" and "Gao Jia Shan" are Anhua place
#      names, but YS uses each one by itself as the Producer tag, and neither
#      is used as a tea-origin label in the fixture titles. See their notes.
#   4. Abbreviations of two letters are excluded ("FT" for Fei Tai, "YS");
#      three-letter abbreviations are kept only when each has one referent in
#      the tea community (W2T, CLT).
#
# Deliberately NOT listed (decisions recorded here so nobody adds them back
# without review):
#   - "Other", "Other Factories": YS placeholder buckets that span unrelated
#     factories. They must never be aliases. The current vendor/tag fallback
#     creates a single producer named "Other" from them, which data-engineer
#     should look at.
#   - "Zhongcha" / "Zhong Cha" / "中茶" / "COFCO" / "中粮" / "China Tea":
#     中茶 is a China Tea Co. (COFCO) trademark that several producing
#     entities use: the CNNP Yunnan, Hunan and Guangxi branches, and before
#     the 1990s cakes pressed by Menghai, Xiaguan and Kunming. The fixtures
#     show the problem directly: vendor "COFCO" + Producer tag "CNNP (Hunan)"
#     + title `2017 Zhong Cha "Ya Pan Ye Fang" ... Fu Brick of Hunan`.
#     Aliasing any of these to one CNNP branch would merge the branches.
#   - "Yunnan Sourcing Tea Shop", "Yunnan Sourcing USA", "Yunnan Sourcing",
#     "Yunnan Sourcing China", "YS": these name the RETAILER, not the
#     in-house brand. 346 YS products carry vendor "Yunnan Sourcing Tea Shop"
#     with no Producer tag, and they are third-party teas (e.g. `Fuding Shou
#     Mei White Tea in King Orange`).
#   - "Printify", "Limited" (Crimson Lotus vendor fields): merch fulfilment
#     and noise, not producers.
#   - Teaware artisans and accessory brands (Jin Jia Qi, Su Mo, Samadoyo,
#     Bonston, ...): out of scope for tea-producer canonicalization, and they
#     have no alias variants worth seeding.
#   - "Mengku Rongshi" / "勐库戎氏": almost certainly the post-2000 owner of
#     Shuangjiang Mengku, but the factory-to-company handover is not
#     evidenced in the fixtures. Held back for owner review.

