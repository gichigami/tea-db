[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tea-scrapers"
version = "0.1.0"
description = "Tea recommendation engine — scraper + medallion-pipeline package (raw JSONL → bronze → silver)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Tea Rec Engine Team" }]

# Runtime dependencies. The set is intentionally small — see scrapers spec §2
# tooling table and §11 "Don't add new dependencies casually."
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3,<1.0",
    "beautifulsoup4>=4.12",
    "praw>=7.7",
    "pydantic>=2",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "structlog>=24.1",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "python-ulid>=2.2",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # Hanzi -> toneless pinyin for canonical-matcher keys only (ROADMAP H.2b;
    # spec §12 hybrid sub-q #9). MIT, pure Python, zero deps, 0.84 MB wheel.
    "pypinyin>=0.50,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "vcrpy>=6.0",
]
# BGE-M3 name embeddings for the hybrid canonical matcher (ROADMAP H.3; spec
# §12 "Hybrid canonical matcher" — dependency justification there). OPTIONAL:
# the base install, CI and pytest never need it (tests use committed fixture
# vectors). Install CPU-only torch wheels (~1.2 GB installed vs ~5 GB CUDA):
#   pip install -e '.[embed]' --extra-index-url https://download.pytorch.org/whl/cpu
# torch>=2.6 so transformers loads BGE-M3's pytorch_model.bin with weights_only.
embed = [
    "torch>=2.6",
    "transformers>=4.44,<5",
    "huggingface-hub>=0.23,<1.0",
]

[project.scripts]
tea-scrape = "tea_scrapers.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
